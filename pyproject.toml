[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionforge"
version = "0.1.0"
description = "Compile approved LLM judgment into a frozen, verifiable, signed decision table with deterministic runtime behavior."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["llm", "determinism", "decision-table", "policy-as-code", "rules-engine", "audit", "compliance", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
crypto = ["cryptography>=41"]
dev = ["pytest>=7", "cryptography>=41"]

[project.scripts]
decisionforge = "decisionforge.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/decisionforge"
Issues = "https://github.com/YOUR_USERNAME/decisionforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
